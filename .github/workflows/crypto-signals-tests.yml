name: Crypto Signals Tests

on:
  push:
    branches:
      - aswad-crypto-signals-v1
      - aswad-crypto-signals-v2
    paths:
      - "crypto-signals/**"
      - ".github/workflows/crypto-signals-tests.yml"
  pull_request:
    paths:
      - "crypto-signals/**"
      - ".github/workflows/crypto-signals-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto-signals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crypto-signals/requirements.txt
      - run: pip install -r requirements.txt
      - run: git rev-parse HEAD
      - run: PYTHONPATH=. pytest -q
